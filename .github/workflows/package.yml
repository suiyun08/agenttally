name: Package

# Fork-only: build an ad-hoc signed cctop.app for personal use.
# No Developer ID or notarization, so the app runs with Sparkle updates disabled.
on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: Also render the snapshot screenshots
        type: boolean
        default: false
      snapshot_language:
        description: Language to render the snapshots in
        type: choice
        options: [zh-Hans, en]
        default: zh-Hans

permissions:
  contents: read

jobs:
  package:
    name: Package macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build and bundle
        run: ./scripts/bundle-macos.sh --arch arm64

      - name: Collect extracted strings
        run: |
          mkdir -p dist
          find menubar/build -name '*.stringsdata' > dist/stringsdata-files.txt
          wc -l < dist/stringsdata-files.txt
          tar -cf dist/stringsdata.tar -T dist/stringsdata-files.txt

      - name: Upload extracted strings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stringsdata
          path: dist/stringsdata.tar
          retention-days: 7

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cctop-macOS-arm64
          path: dist/cctop-macOS.zip
          retention-days: 7

  snapshots:
    name: Snapshots (${{ inputs.snapshot_language }})
    if: ${{ inputs.snapshots }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build app
        run: xcodebuild build -project menubar/CctopMenubar.xcodeproj -scheme CctopMenubar -configuration Debug -derivedDataPath menubar/build/ CODE_SIGN_IDENTITY="-"

      # Snapshot tests assert English copy, so other languages fail them; the images are the output.
      - name: Render snapshots
        env:
          CCTOP_SNAPSHOT_OUTPUT_DIR: ${{ runner.temp }}/snapshots
          TEST_RUNNER_CCTOP_SNAPSHOT_OUTPUT_DIR: ${{ runner.temp }}/snapshots
          SNAPSHOT_LANGUAGE: ${{ inputs.snapshot_language }}
        run: |
          mkdir -p "$CCTOP_SNAPSHOT_OUTPUT_DIR"
          # The isolation wrapper rejects -testLanguage; a throwaway CI runner needs no isolation.
          xcodebuild test -project menubar/CctopMenubar.xcodeproj -scheme CctopMenubar -configuration Debug \
            -derivedDataPath menubar/build/ CODE_SIGN_IDENTITY="-" \
            -testLanguage "$SNAPSHOT_LANGUAGE" -testRegion "$([ "$SNAPSHOT_LANGUAGE" = en ] && echo US || echo CN)" \
            -only-testing:CctopMenubarTests/SnapshotTests || true
          ls -la "$CCTOP_SNAPSHOT_OUTPUT_DIR"

      - name: Upload snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots-${{ inputs.snapshot_language }}
          path: ${{ runner.temp }}/snapshots
          retention-days: 7

