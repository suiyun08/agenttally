name: Package

# Fork-only: build an ad-hoc signed cctop.app for personal use.
# No Developer ID or notarization, so the app runs with Sparkle updates disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build and bundle
        run: ./scripts/bundle-macos.sh --arch arm64

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cctop-macOS-arm64
          path: dist/cctop-macOS.zip
          retention-days: 7
