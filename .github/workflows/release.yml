name: Release

# Pushing a vX.Y.Z tag builds AgentTally for Apple Silicon and Intel and publishes a GitHub
# Release with a zip and a DMG for each. The builds are ad-hoc signed unless the Apple signing
# secrets are configured, so they are not notarized and Sparkle updates stay off in them; there
# is no appcast or Homebrew tap to update yet.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-release-version:
    name: Validate release version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate tag matches committed versions
        run: ./scripts/validate-release-version.sh "${GITHUB_REF_NAME}"

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: validate-release-version
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - arch: arm64
          - arch: x86_64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build and bundle
        run: ./scripts/bundle-macos.sh --arch ${{ matrix.arch }}

      - name: Sign and notarize
        id: sign
        if: env.APPLE_IDENTITY != ''
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Import certificate from secrets
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

          ./scripts/sign-and-notarize.sh dist/AgentTally.app

          # Re-create the zip with signed app
          rm -f dist/AgentTally-macOS.zip
          cd dist && ditto -c -k --sequesterRsrc --keepParent AgentTally.app AgentTally-macOS.zip

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Clean up signing keychain
        if: always() && steps.sign.outcome != 'skipped'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Rename zip for release
        run: mv dist/AgentTally-macOS.zip dist/AgentTally-macOS-${{ matrix.arch }}.zip

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: ./scripts/create-dmg.sh --arch ${{ matrix.arch }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentTally-macOS-${{ matrix.arch }}
          path: dist/AgentTally-macOS-${{ matrix.arch }}.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentTally-macOS-${{ matrix.arch }}-dmg
          path: dist/AgentTally-macOS-${{ matrix.arch }}.dmg

  release:
    name: Create Release
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Build release body
        run: |
          TAG="${{ github.ref_name }}"
          BODY="$RUNNER_TEMP/release-body.md"
          NOTES="docs/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then
            cat "$NOTES" > "$BODY"
            echo "" >> "$BODY"
          else
            : > "$BODY"
          fi
          cat >> "$BODY" << BODY
          <details>
          <summary>Installation / 安装</summary>

          1. Download \`AgentTally-macOS-arm64.dmg\` (Apple Silicon) or \`AgentTally-macOS-x86_64.dmg\` (Intel) below and drag **AgentTally** into **Applications**.
          2. This build is not notarized by Apple. The first time you open it, macOS blocks it: open **System Settings › Privacy & Security** and click **Open Anyway**, or run:
             \`\`\`bash
             xattr -dr com.apple.quarantine /Applications/AgentTally.app
             \`\`\`
          3. Open AgentTally, then connect your coding tools in **Settings › Tools**.

          Updates are not automatic yet: watch this repository's releases and replace the app to update.

          1. 在下方下载 \`AgentTally-macOS-arm64.dmg\`（Apple 芯片）或 \`AgentTally-macOS-x86_64.dmg\`（Intel），把 **AgentTally** 拖进「应用程序」。
          2. 这个版本没有经过 Apple 公证，第一次打开会被系统拦下：到「系统设置 › 隐私与安全性」点「仍要打开」，或者在终端运行上面的 \`xattr\` 命令。
          3. 打开 AgentTally（代理指示），在「设置 › 工具」里连接你的编程工具。

          暂不支持自动更新：关注本仓库的 Release，下载新版替换即可。

          </details>
          BODY
          if [ -f "$NOTES" ]; then echo "generate=false" >> "$GITHUB_ENV"; else echo "generate=true" >> "$GITHUB_ENV"; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          draft: false
          generate_release_notes: ${{ env.generate == 'true' }}
          files: |
            artifacts/AgentTally-macOS-arm64/AgentTally-macOS-arm64.zip
            artifacts/AgentTally-macOS-x86_64/AgentTally-macOS-x86_64.zip
            artifacts/AgentTally-macOS-arm64-dmg/AgentTally-macOS-arm64.dmg
            artifacts/AgentTally-macOS-x86_64-dmg/AgentTally-macOS-x86_64.dmg
          body_path: ${{ runner.temp }}/release-body.md
